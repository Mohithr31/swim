# JOCKY Central Server — Production nginx Reverse Proxy + TLS
# Place this in /etc/nginx/sites-available/jocky and symlink to sites-enabled.
# Obtain a certificate with: certbot --nginx -d your.domain.example

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your.domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your.domain.example;

    # ── TLS certificate (managed by Certbot or supply your own) ──────────────
    ssl_certificate     /etc/letsencrypt/live/your.domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.example/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Hardened TLS settings ─────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           DENY                                   always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "no-referrer"                          always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'" always;

    # ── Rate limiting (define zones in nginx.conf http block) ─────────────────
    # http { limit_req_zone $binary_remote_addr zone=jocky_api:10m rate=30r/m; }
    limit_req zone=jocky_api burst=20 nodelay;
    limit_req_status 429;

    # ── Upload size (evidence archives) ──────────────────────────────────────
    client_max_body_size 512m;

    # ── Proxy to JOCKY Flask server ───────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Do not forward raw API key in error logs
        proxy_hide_header  X-JOCKY-API-Key;
    }

    # ── Health check (no auth required, for load-balancer probes) ────────────
    location = /api/health {
        proxy_pass       http://127.0.0.1:5000/api/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # ── Block direct access to evidence files ────────────────────────────────
    location ~ ^/data/ {
        deny all;
        return 403;
    }

    access_log /var/log/nginx/jocky_access.log;
    error_log  /var/log/nginx/jocky_error.log;
}
